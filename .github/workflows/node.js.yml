name: Node.js CI

on:
  push:
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Install Playwright browsers
        run: npx playwright install chromium --only-shell

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

  test:
    runs-on: ubuntu-latest
    needs: setup
    env:
      BASE_URL: ${{ secrets.BASE_URL }}

      STANDARD_USER: ${{ secrets.STANDARD_USER }}
      STANDARD_USER_PASSWORD: ${{ secrets.STANDARD_USER_PASSWORD }}

      LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
      LOCKED_OUT_USER_PASSWORD: ${{ secrets.LOCKED_OUT_USER_PASSWORD }}

      PROBLEM_USER: ${{ secrets.PROBLEM_USER }}
      PROBLEM_USER_PASSWORD: ${{ secrets.PROBLEM_USER_PASSWORD }}

      PERFORMANCE_GLITCH_USER: ${{ secrets.PERFORMANCE_GLITCH_USER }}
      PERFORMANCE_GLITCH_USER_PASSWORD: ${{ secrets.PERFORMANCE_GLITCH_USER_PASSWORD }}

      ERROR_USER: ${{ secrets.ERROR_USER }}
      ERROR_USER_PASSWORD: ${{ secrets.ERROR_USER_PASSWORD }}

      VISUAL_USER: ${{ secrets.VISUAL_USER }}
      VISUAL_USER_PASSWORD: ${{ secrets.VISUAL_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Run tests
        run: npm test